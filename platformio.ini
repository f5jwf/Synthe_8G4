;Conf for ATtiny3224
[env:ATtiny3224]
platform = atmelmegaavr
framework = arduino
board = ATtiny3224
upload_port = COM30
board_build.f_cpu = 20000000L
upload_speed = 115000
upload_flags =
    --tool
    uart
    --device
    ATtiny3224
    --uart
    $UPLOAD_PORT
    --clk
    $UPLOAD_SPEED
upload_command = pymcuprog write --erase $UPLOAD_FLAGS --filename $SOURCE
monitor_eol = CR
monitor_speed = 38400
lib_deps = 
	ppedro74/SerialCommands@^2.2.0
	vermut/ModbusSerial@^1.0.1

;build_flags = -Wl,-Map,firmware.map,-g,-O0
;build_type = debug